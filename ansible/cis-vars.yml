---
# Overrides for a cloud/Marketplace AMI.
# Verify names against roles/UBUNTU24-CIS/defaults/main.yml for the release you pin.

ubtu24cis_level_1: true
ubtu24cis_level_2: true   # L1+L2 Server profile; set false (and drop level2-server tag) for an L1-only product

# PAM (faillock, pwhistory, nullok) + account hardening tasks are gated by this.
# The connecting 'ubuntu' user is excluded from password-aging tasks by the role itself.
ubtu24cis_disruption_high: true

# Time sync: systemd-timesyncd -> Amazon Time Sync (fallback Ubuntu NTP)
ubtu24cis_time_sync_tool: "systemd-timesyncd"
ubtu24cis_time_pool:
  - name: 169.254.169.123
    options: iburst
ubtu24cis_time_servers:
  - name: ntp.ubuntu.com
    options: iburst

# /tmp managed via /etc/fstab tmpfs entry (scripts/50-cis-align.sh)
ubtu24cis_tmp_svc: false

# Separate partitions (/tmp, /var, /var/log, /var/log/audit, /home, /var/tmp)
# can't be created on Canonical's single-root AMI -> documented exceptions.
# Mount-option rules for those paths are skipped automatically when the mount doesn't exist.

# Bootloader password: would block EC2 serial console / unattended reboots
ubtu24cis_rule_1_4_1: false

# 5.2.4: 'ubuntu' is key-only (no password) so cloud-init NOPASSWD sudo must stay.
# Excluding it skips the role's lock-out pre-check; rule still applies to all other users.
ubtu24cis_sudoers_exclude_nopasswd_list:
  - ubuntu
  - ec2-user
  - vagrant

# Firewall: use ufw (Ubuntu default)
ubtu24cis_firewall_package: ufw

# Don't run the goss audit during the build (run it separately on a test instance)
run_audit: false

# AIDE database is created on each server's first boot (ec2-firstboot), not in the image:
# a DB built at image time would not match the launched server, and it saves ~3 min per build.
aide_initiate_command: /bin/true
