name: Quick build & publish PUBLIC AMI (~10 min)

on:
  workflow_run:                # runs automatically after each monthly base build
    workflows: ["Build BASE AMI (monthly, private)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      region:
        description: "Build region"
        default: "ap-south-1"
      arch:
        description: "amd64, arm64 (Graviton) or both"
        default: "both"
      extra_regions:
        description: "Space-separated regions to copy to (blank = none)"
        default: ""

permissions:
  id-token: write
  contents: read


jobs:
  public-ami:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((github.event.inputs.arch == 'amd64' && '["amd64"]') || (github.event.inputs.arch == 'arm64' && '["arm64"]') || '["amd64","arm64"]') }}
    concurrency: ami-build-${{ matrix.arch }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.region || 'ap-south-1' }}
          role-duration-seconds: 18000
      - uses: hashicorp/setup-packer@main
      - name: Install Ansible (only used if a base image must be built first)
        run: pipx install --include-deps ansible-core
      - name: Build and make public
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/make-public-ami.sh \
            "${{ github.event.inputs.region || 'ap-south-1' }}" \
            "$(date -u +%Y.%m.%d)" \
            ${{ github.event.inputs.extra_regions }}
